# Default settings. Copy and edit to run a different region, period or battery.

data:
  # EIA balancing-authority code. DUK = Duke Energy Carolinas.
  # Others: CPLE (Duke Energy Progress East), PJM, ERCO (ERCOT), CISO (CAISO).
  region: DUK
  start: "2024-01-01"
  end: "2026-10-31"
  raw_dir: data/raw
  # Local time zone used for calendar features (hour of day, weekday, holidays)
  timezone: America/New_York
  # Interpolate gaps up to this many hours; longer gaps stay missing
  max_gap_hours: 3

forecast:
  # Day-ahead: forecasts for each day are made with data through the previous day
  horizon_hours: 24
  backtest_days: 90

# Weather for the v0.2 forecast. Weights roughly follow where the load is.
weather:
  locations:
    charlotte: { lat: 35.23, lon: -80.84, weight: 0.6 }
    raleigh: { lat: 35.78, lon: -78.64, weight: 0.4 }
  base_temp_c: 18.3   # 65 F, the usual US degree-day base

# Battery used from v0.2 (optimization) onward. Sized like Duke's Allen
# battery (50 MW, 4 hours) so it is visible against a ~15,000 MW system.
# The small 10 MWh / 2.5 MW unit is kept for arbitrage tests.
battery:
  energy_mwh: 200.0
  power_mw: 50.0
  round_trip_efficiency: 0.90
  min_soc_fraction: 0.10
  max_soc_fraction: 0.95
  initial_soc_fraction: 0.50

prices:
  market: ERCOT
  location: HB_NORTH
