[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridopt"
version = "0.1.0"
description = "Forecast electricity demand and optimize grid battery schedules under uncertainty"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jordano Liberato" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
app = ["streamlit>=1.36"]
dev = ["pytest>=8.0"]

[project.scripts]
gridopt = "gridopt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
